[package]
name = "eushully-bin-editor"
version = "1.5.0"
edition = "2021"

[lib]
name = "eushully_bin_editor_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "eushully-bin-editor"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
hex = "0.4"
keyring = { version = "3", features = ["windows-native"] }
tokio-util = "0.7"
# Parente @ARCH000/UnityFS/TextAsset layers, shared with the Sys Decompiler
parente-arc = { path = "../crates/parente-arc" }
# Browse & Extract workspace engine (archives, previews, extraction, mods) — shared
# with the Sys Decompiler's AGE Extractor and `eushully` CLI. See src/assets/.
eushully-assets = { path = "../crates/eushully-assets" }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Fanpatch branding art: the UI renders PNG data URLs, engine::branding encodes AGF.
png = "0.17"
base64 = "0.22"
# Parente CONFIG.DAT codec (AES-256-CBC + raw deflate) — see src/parente/config.rs
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
flate2 = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
